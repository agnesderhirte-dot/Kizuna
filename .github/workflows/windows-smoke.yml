name: KIZUNA – Windows package smoke check
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'desktop/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/windows-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kizuna-windows-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows-package-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Build renderer and TypeScript
        run: pnpm build
      - name: Package unsigned Windows directory for testing only
        run: pnpm exec electron-builder --win --x64 --dir --publish never
      - name: Validate packaged EXE startup, preload isolation and persistence
        run: node scripts/package-smoke.cjs
