name: KIZUNA – Windows package smoke check
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'desktop/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/windows-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kizuna-windows-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows-package-smoke:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Build renderer and TypeScript
        run: pnpm build
      - name: Package unsigned Windows directory for testing only
        run: pnpm exec electron-builder --win --x64 --dir --publish never
      - name: Validate packaged EXE startup, preload isolation and persistence
        run: node scripts/package-smoke.cjs
      - name: Validate two simultaneous synthetic game streams and voice chat
        timeout-minutes: 12
        env:
          VOXRALLY_EXE: ${{ github.workspace }}/release/win-unpacked/VoxRally.exe
        run: pnpm test:desktop
      - name: Build unsigned NSIS test installer (no publication)
        run: pnpm exec electron-builder --win nsis --x64 --publish never
      - name: Create SHA-256 manifest for the test installer
        shell: pwsh
        run: |
          $installer = 'release/KIZUNA-Setup-x64.exe'
          if (!(Test-Path $installer)) { throw "Installer fehlt: $installer" }
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -eq 'Valid') {
            Write-Host 'Installer ist gueltig signiert; dieser Workflow soll lediglich unsignierte Testinstallationen erstellen.'
          }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  KIZUNA-Setup-x64.exe" | Set-Content -Path 'release/KIZUNA-Setup-x64.exe.sha256' -Encoding utf8
          Write-Host "SHA-256: $hash"
      - name: Provide unsigned 0.4.0 test installer as short-lived workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: KIZUNA-0.4.0-x64-UNSIGNED-TEST-ONLY
          path: |
            release/KIZUNA-Setup-x64.exe
            release/KIZUNA-Setup-x64.exe.sha256
            docs/TEST_INSTALLER_README.md
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
